<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<link rel="icon" href="icon-192.png">
<title>Vật lý dễ hiểu – THCS</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mute:#5d6b82;--line:#dfe5ee;--acc:#2563eb;
  --co:#2563eb;--nhiet:#dc4a26;--dien:#0f9d6b;--quang:#8b3fd9}
*{box-sizing:border-box}
body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#172033;z-index:50}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
nav{background:#172033;color:#fff;padding:16px 12px;overflow:auto}
nav h1{font-size:19px;margin:4px 8px 2px}
nav .sub{font-size:13px;color:#9fb0cc;margin:0 8px 14px}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:14px 8px 6px;font-weight:700;display:flex;align-items:center;gap:8px}
.grp i{width:10px;height:10px;border-radius:50%;display:inline-block}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#dbe4f3;font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer}
nav button:hover{background:#243251}
nav button.on{background:#fff;color:#172033;font-weight:600}
main{padding:18px 22px 28px;min-width:0}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head .t{flex:1;min-width:220px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:3px 10px;border-radius:99px;margin-bottom:6px}
h2{margin:0;font-size:26px;line-height:1.2}
.goal{color:var(--mute);margin:6px 0 0;max-width:70ch}
.tools{display:flex;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:#9fb0cc}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.stage{padding:8px}
canvas{display:block;width:100%;aspect-ratio:800/460;border-radius:8px;background:#fff}
.side{display:flex;flex-direction:column;gap:14px}
.box{padding:14px 16px}
.box h3{margin:0 0 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.ctl{margin-bottom:12px}
.ctl:last-child{margin-bottom:0}
.ctl label{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px;gap:8px}
.ctl output{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--acc);height:26px;margin:0}
select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:15px}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.verdict{margin-top:10px;padding:10px 12px;border-radius:8px;background:#eef4ff;font-weight:600;font-size:15px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.below{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.below ol{margin:0;padding-left:20px}
.below li{margin-bottom:6px}
.real{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.real figure{margin:0}
.real svg{display:block;width:100%;background:#f3f7fc;border-radius:10px;border:1px solid var(--line)}
.real figcaption{font-size:15px;margin-top:8px;line-height:1.4}
.real figcaption b{display:block;margin-bottom:2px}
@media(max-width:760px){.real{grid-template-columns:1fr}}
details summary{cursor:pointer;font-weight:600;color:var(--acc)}
details p{margin:10px 0 0}
:fullscreen nav{display:none}
:fullscreen .app{grid-template-columns:1fr}
@media(max-width:1000px){.work{grid-template-columns:1fr}.below{grid-template-columns:1fr}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  nav{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
  nav h1,nav .sub{display:none}
  .grp{margin:0 2px 0 8px;white-space:nowrap}
  nav button{width:auto;white-space:nowrap;padding:8px 10px}
  main{padding:12px}
  h2{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <h1>Vật lý dễ hiểu</h1>
    <p class="sub">Mô phỏng tương tác · THCS</p>
  </nav>
  <main>
    <div class="head">
      <div class="t">
        <span class="tag" id="tag"></span>
        <h2 id="title"></h2>
        <p class="goal" id="goal"></p>
      </div>
      <div class="tools">
        <button class="btn" id="pause">⏸ Tạm dừng</button>
        <button class="btn pri" id="full">⛶ Trình chiếu</button>
      </div>
    </div>
    <div class="work">
      <div class="card stage"><canvas id="cv"></canvas></div>
      <div class="side">
        <div class="card box"><h3>Điều chỉnh</h3><div id="ctl"></div></div>
        <div class="card box"><h3>Số liệu quan sát</h3><div id="read"></div></div>
      </div>
    </div>
    <div class="card box" style="margin-top:16px"><h3>Trong thực tế</h3><div class="real" id="real"></div></div>
    <div class="below">
      <div class="card box"><h3>Câu hỏi gợi mở</h3><ol id="qs"></ol></div>
      <div class="card box"><h3>Kết luận</h3>
        <details id="det"><summary>Bấm để hiện kết luận</summary><p id="concl"></p></details>
      </div>
    </div>
  </main>
</div>
<script>
"use strict";
const W=800,H=460,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let scale=1;
const GROUPS={co:['Cơ học','#2563eb'],nhiet:['Nhiệt học','#dc4a26'],dien:['Điện học','#0f9d6b'],quang:['Quang học','#8b3fd9']};
const f=(n,d=1)=>Number(n).toFixed(d).replace('.',',');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
const verdict=t=>`<div class="verdict">${t}</div>`;
const note=t=>`<div class="note">${t}</div>`;

/* ---------- vẽ cơ bản ---------- */
function line(x1,y1,x2,y2,col='#1c2433',w=2,dash){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function txt(s,x,y,o={}){ctx.save();ctx.font=(o.bold?'600 ':'')+(o.size||15)+'px "Segoe UI",system-ui,Arial';ctx.fillStyle=o.col||'#1c2433';ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';ctx.fillText(s,x,y);ctx.restore();}
function head(x,y,ang,col,s=10){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s,-s*.45);ctx.lineTo(-s,s*.45);ctx.closePath();ctx.fill();ctx.restore();}
function arrow(x1,y1,x2,y2,col,w=3){if(Math.hypot(x2-x1,y2-y1)<2)return;line(x1,y1,x2,y2,col,w);head(x2,y2,Math.atan2(y2-y1,x2-x1),col,11);}
function flow(p,off,sp,col){let L=0;const seg=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,l]);L+=l;}
  const n=Math.round(L/sp);sp=L/n;ctx.fillStyle=col;
  for(let k=0;k<n;k++){let d=(((off%L)+L)%L+k*sp)%L;for(const [a,b,l] of seg){if(d<=l){ctx.beginPath();ctx.arc(a[0]+(b[0]-a[0])*d/l,a[1]+(b[1]-a[1])*d/l,4,0,7);ctx.fill();break;}d-=l;}}}
function poly(p,col,w=3){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.stroke();ctx.restore();}
function battery(x,y,U){ctx.fillStyle='#fff';ctx.fillRect(x-20,y-9,40,18);line(x-18,y-7,x+18,y-7,'#1c2433',3);line(x-9,y+7,x+9,y+7,'#1c2433',6);
  txt('+',x-30,y-9,{bold:1,size:18,col:'#dc2626'});txt('−',x-30,y+9,{bold:1,size:18,col:'#2563eb'});txt('U = '+f(U,1)+' V',x-14,y+38,{size:14,bold:1,align:'center'});}
function bulb(x,y,P,name){const a=clamp(P/10,0,1);ctx.save();
  if(a>0.02){const g=ctx.createRadialGradient(x,y,5,x,y,30+a*40);g.addColorStop(0,`rgba(255,200,40,${.25+a*.6})`);g.addColorStop(1,'rgba(255,200,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,30+a*40,0,7);ctx.fill();}
  ctx.fillStyle=`rgb(255,${Math.round(255-a*45)},${Math.round(255-a*200)})`;ctx.strokeStyle='#1c2433';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-17,y-17);ctx.lineTo(x+17,y+17);ctx.moveTo(x+17,y-17);ctx.lineTo(x-17,y+17);ctx.stroke();ctx.restore();
  if(name)txt(name,x,y-40,{bold:1});}
function axes(x0,y0,x1,y1,xl,yl){arrow(x0,y0,x1+18,y0,'#1c2433',2);arrow(x0,y0,x0,y1-18,'#1c2433',2);txt(xl,x1+18,y0+32,{size:14,align:'right'});txt(yl,x0+8,y1-26,{size:14,align:'left'});}

/* ---------- các bài học ---------- */
const LESSONS=[
/* 1. Đòn bẩy */
{id:'donbay',g:'co',title:'Đòn bẩy',grade:'Lớp 6',
 goal:'Thay đổi độ lớn lực và khoảng cách đến điểm tựa ở hai bên để tìm điều kiện đòn bẩy cân bằng.',
 ctl:[{k:'F1',label:'Lực F₁ (bên trái)',min:1,max:10,step:1,v:4,u:'N'},{k:'d1',label:'Khoảng cách d₁',min:10,max:50,step:5,v:30,u:'cm'},
      {k:'F2',label:'Lực F₂ (bên phải)',min:1,max:10,step:1,v:6,u:'N'},{k:'d2',label:'Khoảng cách d₂',min:10,max:50,step:5,v:20,u:'cm'}],
 init(s){s.a=0;},
 draw(s,dt){const M1=s.F1*s.d1,M2=s.F2*s.d2,k=5.2,px=400,py=200;
  const tg=M1===M2?0:Math.sign(M2-M1)*(5+11*Math.min(1,Math.abs(M2-M1)/(M1+M2)*2.5))*Math.PI/180;
  s.a+=(tg-s.a)*Math.min(1,dt*3);
  line(120,400,680,400,'#8a96a8',3);
  ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.moveTo(px,py+6);ctx.lineTo(px-42,400);ctx.lineTo(px+42,400);ctx.closePath();ctx.fill();
  txt('Điểm tựa O',px,420,{size:14,col:'#5d6b82'});
  ctx.save();ctx.translate(px,py);ctx.rotate(s.a);ctx.fillStyle='#b7793a';ctx.strokeStyle='#7a4b1c';ctx.lineWidth=2;ctx.fillRect(-272,-9,544,18);ctx.strokeRect(-272,-9,544,18);
  for(let c=10;c<=50;c+=10)for(const sg of[-1,1]){line(sg*c*k,-9,sg*c*k,2,'#fff',2);txt(c,sg*c*k,-22,{size:12,col:'#5d6b82'});}
  ctx.restore();
  const hang=(d,F,sg,col,name)=>{const x=px+sg*d*k*Math.cos(s.a),y=py+sg*d*k*Math.sin(s.a),sz=30+F*4;
   line(x,y,x,y+34,'#1c2433',2);ctx.fillStyle=col;ctx.fillRect(x-sz/2,y+34,sz,sz);txt(name,x,y+34+sz/2-8,{col:'#fff',bold:1,size:13});txt(F+' N',x,y+34+sz/2+9,{col:'#fff',bold:1,size:13});};
  hang(s.d1,s.F1,-1,'#2563eb','F₁');hang(s.d2,s.F2,1,'#dc4a26','F₂');
  ctx.fillStyle='#1c2433';ctx.beginPath();ctx.arc(px,py,6,0,7);ctx.fill();
  txt(M1===M2?'CÂN BẰNG':(M1>M2?'Nghiêng về bên trái':'Nghiêng về bên phải'),400,50,{bold:1,size:22,col:M1===M2?'#0f9d6b':'#b45309'});},
 read(s){const M1=s.F1*s.d1,M2=s.F2*s.d2;return row('F₁ × d₁',`${s.F1} × ${s.d1} = ${M1}`)+row('F₂ × d₂',`${s.F2} × ${s.d2} = ${M2}`)+
  verdict(M1===M2?'F₁·d₁ = F₂·d₂ → đòn bẩy cân bằng':(M1>M2?'F₁·d₁ > F₂·d₂ → đầu bên trái hạ xuống':'F₁·d₁ < F₂·d₂ → đầu bên phải hạ xuống'));},
 qs:['Giữ nguyên F₁ và d₁. Có những cặp (F₂, d₂) nào làm đòn bẩy cân bằng?','Muốn dùng lực nhỏ để nâng vật nặng thì phải đặt lực ở xa hay gần điểm tựa?','Kể tên vài dụng cụ trong đời sống hoạt động như đòn bẩy (kéo, xà beng, bập bênh…).'],
 concl:'Đòn bẩy cân bằng khi F₁·d₁ = F₂·d₂. Lực đặt càng xa điểm tựa thì tác dụng làm quay càng lớn, nên có thể dùng lực nhỏ để thắng lực lớn nếu cánh tay đòn dài hơn.'},

/* 2. Lực đẩy Ác-si-mét */
{id:'acsimet',g:'co',title:'Lực đẩy Ác-si-mét và sự nổi',grade:'Lớp 8',
 goal:'Thả một vật vào chất lỏng, so sánh trọng lượng P với lực đẩy F_A để biết vật nổi, lơ lửng hay chìm.',
 ctl:[{k:'Dl',label:'Chất lỏng',type:'select',v:1000,opts:[[800,'Dầu ăn (800 kg/m³)'],[1000,'Nước (1000 kg/m³)'],[1200,'Nước muối (1200 kg/m³)']]},
      {k:'Dv',label:'Khối lượng riêng của vật',min:200,max:2700,step:50,v:600,u:'kg/m³'},
      {k:'V',label:'Thể tích vật',min:0.5,max:3,step:0.5,v:1,u:'dm³',d:1},
      {type:'button',label:'↻ Thả lại từ trên cao',act(s){s.y=40;s.vy=0;}}],
 init(s){s.y=40;s.vy=0;s.fr=0;},
 draw(s,dt){const top=180,bot=420,side=50*Math.cbrt(s.V),g=600;
  for(let i=0;i<4;i++){const h=dt/4;s.fr=clamp((s.y+side-top)/side,0,1);const a=g*(1-s.fr*s.Dl/s.Dv);s.vy+=a*h;if(s.fr>0)s.vy*=Math.exp(-3.5*h);s.y+=s.vy*h;if(s.y+side>=bot){s.y=bot-side;s.vy=Math.min(0,s.vy);}}
  s.fr=clamp((s.y+side-top)/side,0,1);
  const lc={800:'rgba(240,200,60,.45)',1000:'rgba(80,160,235,.4)',1200:'rgba(60,190,190,.45)'}[s.Dl];
  ctx.fillStyle=lc;ctx.fillRect(220,top,360,bot-top);
  ctx.strokeStyle='#1c2433';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(220,110);ctx.lineTo(220,bot);ctx.lineTo(580,bot);ctx.lineTo(580,110);ctx.stroke();
  line(220,top,580,top,'#2f6fb5',2);txt('Mặt thoáng',640,top,{size:13,col:'#5d6b82'});
  const x=400-side/2;ctx.fillStyle=s.Dv<700?'#c58a4a':s.Dv<1500?'#9aa7b8':'#6b7686';ctx.fillRect(x,s.y,side,side);ctx.strokeStyle='#1c2433';ctx.lineWidth=2;ctx.strokeRect(x,s.y,side,side);
  const P=s.Dv*s.V/100,FA=s.Dl*s.V*s.fr/100,sc=95/Math.max(P,s.Dl*s.V/100),cx=400,cy=s.y+side/2;
  arrow(cx-9,cy,cx-9,cy+P*sc,'#dc2626',4);txt('P',cx-26,cy+P*sc-4,{bold:1,col:'#dc2626',size:17});
  if(FA>0.01){arrow(cx+9,cy,cx+9,cy-FA*sc,'#2563eb',4);txt('F_A',cx+34,cy-FA*sc+6,{bold:1,col:'#2563eb',size:17});}
  s.P=P;s.FA=FA;},
 read(s){const st=s.Dv<s.Dl?'Vật NỔI (D vật &lt; D chất lỏng)':s.Dv===s.Dl?'Vật LƠ LỬNG (D vật = D chất lỏng)':'Vật CHÌM (D vật &gt; D chất lỏng)';
  return row('Trọng lượng P',f(s.P||0,1)+' N')+row('Lực đẩy F_A',f(s.FA||0,1)+' N')+row('Phần thể tích chìm',Math.round((s.fr||0)*100)+' %')+verdict(st)+note('F_A = d·V<sub>chìm</sub>, với d = 10·D là trọng lượng riêng của chất lỏng.');},
 qs:['Khi vật nổi yên trên mặt chất lỏng, P và F_A so với nhau thế nào?','Cùng một vật, đổi từ nước sang nước muối thì phần chìm tăng hay giảm? Vì sao?','Tàu làm bằng thép (D ≈ 7800 kg/m³) vì sao vẫn nổi trên nước?'],
 concl:'Vật nhúng trong chất lỏng chịu lực đẩy hướng lên F_A = d·V (V là thể tích phần chìm). Vật nổi khi D vật < D chất lỏng, lơ lửng khi bằng nhau và chìm khi lớn hơn. Khi nổi yên, F_A = P.'},

/* 3. Chuyển động phân tử */
{id:'phantu',g:'nhiet',title:'Chuyển động phân tử và khuếch tán',grade:'Lớp 8',
 goal:'Quan sát các phân tử của hai chất chuyển động hỗn loạn và tự trộn lẫn vào nhau; nhiệt độ càng cao, chuyển động càng nhanh.',
 ctl:[{k:'T',label:'Nhiệt độ',min:0,max:100,step:5,v:25,u:'°C'},{type:'button',label:'↻ Tách hai chất ra như ban đầu',act(s){this.reset(s);}}],
 reset(s){s.p=[];for(let i=0;i<90;i++){const left=i<45;s.p.push({x:(left?70:410)+Math.random()*320,y:50+Math.random()*360,a:Math.random()*6.283,k:.6+Math.random()*.8,c:left?0:1});}s.time=0;},
 init(s){LESSONS[2].reset(s);},
 draw(s,dt){const v=45+s.T*2.4;s.time+=dt;
  ctx.fillStyle='#f8fafc';ctx.fillRect(60,40,680,380);ctx.strokeStyle='#1c2433';ctx.lineWidth=3;ctx.strokeRect(60,40,680,380);line(400,40,400,420,'#94a3b8',1.5,[6,6]);
  let mix=0;for(const q of s.p){q.a+=(Math.random()-.5)*dt*9;q.x+=Math.cos(q.a)*v*q.k*dt;q.y+=Math.sin(q.a)*v*q.k*dt;
   if(q.x<68){q.x=68;q.a=Math.PI-q.a;}if(q.x>732){q.x=732;q.a=Math.PI-q.a;}if(q.y<48){q.y=48;q.a=-q.a;}if(q.y>412){q.y=412;q.a=-q.a;}
   if((q.c===0&&q.x>400)||(q.c===1&&q.x<400))mix++;
   ctx.fillStyle=q.c?'#f59e0b':'#2563eb';ctx.beginPath();ctx.arc(q.x,q.y,7,0,7);ctx.fill();}
  s.mix=Math.min(100,Math.round(mix/s.p.length*200));
  txt('Nhiệt độ: '+s.T+' °C',400,20,{bold:1,size:17,col:'#dc4a26'});

  if(Q>=QM)txt('Hết lượt đun – bấm “Đun lại” để thử công suất khác',gx+gw/2,gy-gh-2,{size:13,col:'#5d6b82'});},

{id:'thaukinh',g:'quang',title:'Ảnh của vật tạo bởi thấu kính',grade:'Lớp 9',
 goal:'Di chuyển vật trước thấu kính và dựng ảnh bằng hai tia đặc biệt; nhận xét ảnh thật hay ảo, cùng chiều hay ngược chiều, lớn hay nhỏ hơn vật.',
 ctl:[{k:'type',label:'Loại thấu kính',type:'select',v:'ht',opts:[['ht','Hội tụ'],['pk','Phân kì']]},{k:'fo',label:'Tiêu cự f',min:5,max:20,step:1,v:10,u:'cm'},
      {k:'d',label:'Khoảng cách từ vật đến thấu kính d',min:2,max:45,step:0.5,v:25,u:'cm',d:1},{k:'h',label:'Chiều cao vật h',min:2,max:8,step:0.5,v:5,u:'cm',d:1}],
 init(){},
 calc(s){const fs=s.type==='ht'?s.fo:-s.fo;if(Math.abs(s.d-fs)<1e-9)return{fs,none:true};const di=s.d*fs/(s.d-fs);return{fs,di,hi:-s.h*di/s.d};},
 draw(s){const k=8,ox=400,oy=230,c=LESSONS[7].calc(s),fs=c.fs,ax=ox-s.d*k,ay=oy-s.h*k;
  line(20,oy,780,oy,'#64748b',1.5);
  /* thấu kính */
  line(ox,oy-160,ox,oy+160,'#0891b2',4);const ht=s.type==='ht';
  for(const sg of[-1,1]){const y=oy+sg*160;if(ht){line(ox-11,y-sg*14,ox,y,'#0891b2',4);line(ox+11,y-sg*14,ox,y,'#0891b2',4);}else{line(ox-11,y+sg*14,ox,y,'#0891b2',4);line(ox+11,y+sg*14,ox,y,'#0891b2',4);}}
  txt('O',ox+12,oy+14,{size:14});
  for(const [x,n] of[[ox-s.fo*k,'F'],[ox+s.fo*k,"F'"]]){ctx.fillStyle='#1c2433';ctx.beginPath();ctx.arc(x,oy,4,0,7);ctx.fill();txt(n,x,oy+16,{size:14,bold:1});}
  const ext=(x0,y0,dx,dy,col)=>{const t=(790-x0)/dx;line(x0,y0,x0+dx*t,y0+dy*t,col,2.5);head(x0+dx*t*.25,y0+dy*t*.25,Math.atan2(dy,dx),col,12);};
  ctx.save();ctx.beginPath();ctx.rect(10,10,780,440);ctx.clip();
  /* tia 1: song song trục chính */
  line(ax,ay,ox,ay,'#f59e0b',2.5);head((ax+ox)/2,ay,0,'#f59e0b',12);
  if(fs>0)ext(ox,ay,fs*k,oy-ay,'#f59e0b');else{ext(ox,ay,-fs*k,ay-oy,'#f59e0b');line(ox+fs*k,oy,ox,ay,'#f59e0b',1.5,[6,5]);}
  /* tia 2: qua quang tâm */
  line(ax,ay,ox,oy,'#16a34a',2.5);ext(ox,oy,ox-ax,oy-ay,'#16a34a');
  /* vật */
  arrow(ax,oy,ax,ay,'#2563eb',5);txt('A',ax,oy+16,{size:14,bold:1,col:'#2563eb'});txt('B',ax-12,ay-4,{size:14,bold:1,col:'#2563eb'});
  if(!c.none){const ix=ox+c.di*k,iy=oy-c.hi*k,virt=c.di<0;
   if(virt&&fs>0){line(ox,ay,ix,iy,'#f59e0b',1.5,[6,5]);line(ax,ay,ix,iy,'#16a34a',1.5,[6,5]);}
   ctx.save();if(virt)ctx.setLineDash([7,5]);ctx.strokeStyle='#dc2626';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ix,oy);ctx.lineTo(ix,iy);ctx.stroke();ctx.restore();head(ix,iy,Math.atan2(iy-oy,0),'#dc2626',12);
   txt("A'",ix,oy+(c.hi<0?-14:16),{size:14,bold:1,col:'#dc2626'});txt("B'",ix+14,iy+(c.hi<0?8:-4),{size:14,bold:1,col:'#dc2626'});}
  ctx.restore();
  if(c.none)txt('Vật đặt đúng tiêu điểm: các tia ló song song, không tạo ảnh',400,430,{bold:1,size:15,col:'#dc2626'});
  txt('Tia song song trục chính',30,28,{align:'left',size:13,col:'#b45309'});txt('Tia qua quang tâm O',30,48,{align:'left',size:13,col:'#16a34a'});},
 read(s){const c=LESSONS[7].calc(s);if(c.none)return row('Tiêu cự f',s.fo+' cm')+row('d',f(s.d,1)+' cm')+verdict('d = f → không có ảnh (ảnh ở vô cực)');
  const virt=c.di<0,hi=Math.abs(c.hi),sz=Math.abs(hi-s.h)<0.01?'bằng vật':hi>s.h?'lớn hơn vật':'nhỏ hơn vật';
  return row('Khoảng cách vật d',f(s.d,1)+' cm')+row("Khoảng cách ảnh d'",f(Math.abs(c.di),1)+' cm'+(virt?' (cùng phía vật)':''))+row("Chiều cao ảnh h'",f(hi,1)+' cm')+
   verdict(`Ảnh ${virt?'ẢO':'THẬT'}, ${virt?'cùng chiều':'ngược chiều'}, ${sz}`)+note('Nét đứt là đường kéo dài của tia ló; ảnh ảo vẽ bằng nét đứt.');},
 qs:['Với thấu kính hội tụ, đưa vật từ rất xa lại gần: ảnh thay đổi thế nào khi d > 2f, d = 2f, f < d < 2f?','Khi d < f, ảnh nằm ở đâu, có hứng được trên màn không? Dụng cụ nào dùng cách này?','Đổi sang thấu kính phân kì và di chuyển vật: tính chất của ảnh có thay đổi không?'],
 concl:'Thấu kính hội tụ: vật ngoài tiêu cự (d > f) cho ảnh thật, ngược chiều — nhỏ hơn vật khi d > 2f, bằng vật khi d = 2f, lớn hơn vật khi f < d < 2f; vật trong tiêu cự (d < f) cho ảnh ảo, cùng chiều, lớn hơn vật (kính lúp). Thấu kính phân kì luôn cho ảnh ảo, cùng chiều, nhỏ hơn vật và nằm trong khoảng tiêu cự.'}

function cflame(x,y,h,ph){const w=Math.sin(ph)*3;ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(x-h*.45,y);ctx.quadraticCurveTo(x+w,y-h*1.9,x+h*.45,y);ctx.fill();ctx.fillStyle='#fde047';ctx.beginPath();ctx.moveTo(x-h*.2,y);ctx.quadraticCurveTo(x+w,y-h,x+h*.2,y);ctx.fill();}
function disc(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,7);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2.5;ctx.stroke();}}
function pline(P,col,w,dash){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
function fpoly(P,fill){ctx.fillStyle=fill;ctx.beginPath();P.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}

{id:'tocdo',g:'co',title:'Chuyển động đều và tốc độ',grade:'Lớp 7',

  line(X(100),45,X(100),160,'#dc2626',3);
  const car=(m,y,c,n)=>{const x=X(m);ctx.fillStyle=c;ctx.fillRect(x-40,y-10,40,20);ctx.fillRect(x-32,y-20,22,12);disc(x-31,y+11,6,'#1c2433');disc(x-9,y+11,6,'#1c2433');txt(n,x-20,y,{col:'#fff',bold:1,size:13});};
  car(sA,76,'#2563eb','A');car(sB,132,'#dc4a26','B');
  const gx=110,gy=415,gw=520,gh=185,GX=t=>gx+t/50*gw,GY=m=>gy-m/100*gh;axes(gx,gy,gx+gw,gy-gh,'t (s)','s (m)');

 read(s){const sA=Math.min(100,s.vA*s.t),sB=Math.min(100,s.vB*s.t);return row('Thời gian',f(s.t,1)+' s')+row('Xe A đi được',f(sA,0)+' m')+row('Xe B đi được',f(sB,0)+' m')+row('Thời gian đi hết 100 m','A: '+f(100/s.vA,1)+' s · B: '+f(100/s.vB,1)+' s')+verdict('v = s / t. Đường đồ thị càng dốc thì xe chạy càng nhanh.');},

{id:'apsuat',g:'co',title:'Áp suất trên một bề mặt',grade:'Lớp 8',
 goal:'Thay đổi áp lực và diện tích bị ép, quan sát khối kim loại lún sâu hay nông trên mặt cát.',
 ctl:[{k:'F',label:'Áp lực F',min:10,max:200,step:10,v:60,u:'N'},{k:'A',label:'Diện tích bị ép S',min:10,max:200,step:10,v:50,u:'cm²'}],

  ctx.fillStyle='#e8c98a';ctx.fillRect(80,top,640,140);ctx.fillStyle='#fff';ctx.fillRect(bx-1,top-2,w+2,s.dep+2);
  ctx.fillStyle='#64748b';ctx.fillRect(bx,by,w,bh);ctx.strokeStyle='#1c2433';ctx.lineWidth=2;ctx.strokeRect(bx,by,w,bh);

 qs:['Giữ nguyên F, giảm S đi một nửa thì áp suất thay đổi thế nào?','Có hai cách nào để làm giảm độ lún của khối kim loại?','Vì sao mũi đinh, mũi kim phải làm nhọn còn móng nhà phải làm rộng?'],

{id:'apsuatlong',g:'co',title:'Áp suất chất lỏng',grade:'Lớp 8',

 ctl:[{k:'H',label:'Độ cao mực chất lỏng',min:20,max:100,step:5,v:90,u:'cm'},{k:'d',label:'Chất lỏng',type:'select',v:10000,opts:[[8000,'Dầu (d = 8 000 N/m³)'],[10000,'Nước (d = 10 000 N/m³)'],[12000,'Nước muối (d = 12 000 N/m³)']]},{k:'h',label:'Độ sâu điểm đo',min:0,max:100,step:5,v:50,u:'cm'}],
 init(s){s.c=0;},
 draw(s,dt){s.c+=dt;const bot=400,k=3,x0=150,x1=330,top=bot-s.H*k,col={8000:'rgba(240,200,60,.5)',10000:'rgba(80,160,235,.45)',12000:'rgba(60,190,190,.5)'}[s.d];
  line(40,430,780,430,'#8a96a8',3);ctx.fillStyle='#94a3b8';ctx.fillRect(x0-12,bot,x1-x0+24,30);ctx.fillStyle=col;ctx.fillRect(x0,top,x1-x0,bot-top);
  pline([[x0,80],[x0,bot],[x1,bot],[x1,80]],'#1c2433',4);
  for(const hc of[15,45,75]){const y=bot-hc*k,dep=s.H-hc;ctx.fillStyle='#fff';ctx.fillRect(x1-3,y-5,6,10);if(dep<=0)continue;const v=24*Math.sqrt(dep),P=[];for(let t=0;;t+=.03){const yy=y+250*t*t;P.push([x1+v*t,Math.min(430,yy)]);if(yy>=430)break;}
   ctx.save();ctx.lineDashOffset=-s.c*90;pline(P,'#3b82f6',4,[12,6]);ctx.restore();}
  const hh=Math.min(s.h,s.H),y=top+hh*k;line(x0-30,top,x0-30,y,'#dc2626',2);line(x0-36,top,x0-24,top,'#dc2626',2);line(x0-36,y,x0-24,y,'#dc2626',2);txt('h = '+hh+' cm',x0-38,(top+y)/2,{align:'right',size:14,col:'#dc2626',bold:1});
  disc(x0+50,y,7,'#dc2626');for(const a of[0,1.57,3.14,4.71])arrow(x0+50+Math.cos(a)*30,y+Math.sin(a)*30,x0+50+Math.cos(a)*11,y+Math.sin(a)*11,'#dc2626',2);
  txt('p = d · h = '+f(s.d*hh/100,0)+' N/m²',570,60,{bold:1,size:20,col:'#2563eb'});txt('Chất lỏng gây áp suất theo mọi phương',570,90,{size:13,col:'#5d6b82'});},
 read(s){const hh=Math.min(s.h,s.H),p=hc=>s.H>hc?f(s.d*(s.H-hc)/100,0)+' N/m²':'không có nước';return row('Áp suất tại điểm đo',f(s.d*hh/100,0)+' N/m²')+row('Tại lỗ trên',p(75))+row('Tại lỗ giữa',p(45))+row('Tại lỗ dưới',p(15))+verdict('Càng xuống sâu, áp suất chất lỏng càng lớn: p = d·h');},
 qs:['Tia nước ở lỗ nào phun ra mạnh nhất? Điều đó cho biết gì về áp suất?','Ở cùng một độ sâu, đổi nước thành nước muối thì áp suất tăng hay giảm?','Vì sao thợ lặn xuống sâu phải mặc bộ áo lặn chịu được áp suất lớn?'],
 concl:'Chất lỏng gây áp suất theo mọi phương lên đáy bình, thành bình và các vật ở trong lòng nó. Áp suất tại một điểm trong chất lỏng: p = d·h, với h là độ sâu tính từ mặt thoáng và d là trọng lượng riêng của chất lỏng.'},

{id:'matnghieng',g:'co',title:'Mặt phẳng nghiêng',grade:'Lớp 6',
 goal:'Kéo một vật lên cao bằng mặt phẳng nghiêng; thay đổi độ cao và chiều dài mặt nghiêng để xem lực kéo thay đổi thế nào.',
 ctl:[{k:'P',label:'Trọng lượng vật P',min:50,max:500,step:50,v:200,u:'N'},{k:'h',label:'Độ cao h',min:0.5,max:2,step:0.1,v:1,u:'m',d:1},{k:'l',label:'Chiều dài mặt nghiêng l',min:2,max:6,step:0.5,v:4,u:'m',d:1}],
 init(s){s.u=0;},
 draw(s,dt){s.u=(s.u+dt/5)%1.25;const u=Math.min(1,s.u),k=95,gy=400,ax=90,b=Math.sqrt(s.l*s.l-s.h*s.h)*k,hy=s.h*k,an=Math.atan2(hy,b),F=s.P*s.h/s.l;
  line(50,gy,770,gy,'#8a96a8',3);fpoly([[ax,gy],[ax+b,gy],[ax+b,gy-hy]],'#d6dde8');pline([[ax,gy],[ax+b,gy],[ax+b,gy-hy],[ax,gy]],'#1c2433',2.5);
  line(ax+b+12,gy,ax+b+12,gy-hy,'#1c2433',1.5);txt('h = '+f(s.h,1)+' m',ax+b+18,gy-hy/2,{bold:1,align:'left',size:14});txt('l = '+f(s.l,1)+' m',ax+b/2+10,gy+20,{bold:1,size:14});
  const d=(.1+.78*u)*s.l*k,bx=ax+d*Math.cos(an),by=gy-d*Math.sin(an),fl=30+F*.22;
  ctx.save();ctx.translate(bx,by);ctx.rotate(-an);ctx.fillStyle='#b7793a';ctx.strokeStyle='#1c2433';ctx.lineWidth=2;ctx.fillRect(-22,-36,44,36);ctx.strokeRect(-22,-36,44,36);arrow(22,-18,22+fl,-18,'#2563eb',4);txt('F',30+fl,-32,{bold:1,col:'#2563eb',size:17});ctx.restore();
  const cx=bx-18*Math.sin(an),cy=by-18*Math.cos(an),pl=24+s.P*.1;arrow(cx,cy,cx,cy+pl,'#dc2626',4);txt('P',cx-14,cy+pl-4,{bold:1,col:'#dc2626',size:17});
  txt('Kéo thẳng đứng: cần lực bằng P = '+s.P+' N',60,40,{align:'left',size:16});txt('Kéo theo mặt nghiêng: F = P·h / l = '+f(F,0)+' N',60,68,{align:'left',size:16,bold:1,col:'#2563eb'});},

 qs:['Giữ nguyên độ cao, tăng chiều dài mặt nghiêng thì lực kéo tăng hay giảm?','Được lợi bao nhiêu lần về lực thì quãng đường kéo dài hơn bao nhiêu lần?','Vì sao đường lên đèo thường làm ngoằn ngoèo chứ không chạy thẳng lên đỉnh?'],
 concl:'Dùng mặt phẳng nghiêng có thể kéo vật lên với lực nhỏ hơn trọng lượng của vật. Mặt nghiêng càng thoải (càng dài so với độ cao) thì lực kéo càng nhỏ. Được lợi bao nhiêu lần về lực thì thiệt bấy nhiêu lần về đường đi, không được lợi về công.'},

{id:'conlac',g:'co',title:'Chuyển hoá cơ năng của con lắc',grade:'Lớp 9',
 goal:'Thả con lắc và theo dõi thế năng, động năng thay nhau tăng giảm trong khi con lắc dao động.',
 ctl:[{k:'a0',label:'Góc thả ban đầu',min:10,max:70,step:5,v:45,u:'°'},{k:'ms',label:'Lực cản',type:'select',v:0,opts:[[0,'Bỏ qua lực cản'],[0.15,'Có lực cản của không khí']]},{type:'button',label:'↻ Thả lại',act(s){s.rs=1;}}],

  const px=230,py=50,L=250,bx=px+L*Math.sin(s.th),by=py+L*Math.cos(s.th),a0=s.a0*Math.PI/180;
  line(130,py,330,py,'#1c2433',5);line(40,py+L+22,460,py+L+22,'#94a3b8',1.5,[6,6]);txt('Vị trí thấp nhất',90,py+L+40,{size:13,col:'#5d6b82'});
  for(const sg of[-1,1])disc(px+sg*L*Math.sin(a0),py+L*Math.cos(a0),20,null,'#cbd5e1');
  line(px,py,bx,by,'#1c2433',2);disc(bx,by,20,'#2563eb','#1c2433');
  const E0=1-Math.cos(a0),Ep=1-Math.cos(s.th),Ek=s.w*s.w/(2*W2);s.Ep=Ep/E0*100;s.Ek=Ek/E0*100;
  [['Thế năng',Ep,'#2563eb'],['Động năng',Ek,'#dc4a26'],['Cơ năng',Ep+Ek,'#0f9d6b']].forEach((e,i)=>{const x=530+i*85,h=clamp(e[1]/E0,0,1.05)*260;ctx.fillStyle='#eef2f7';ctx.fillRect(x,120,54,260);ctx.fillStyle=e[2];ctx.fillRect(x,380-h,54,h);txt(e[0],x+27,400,{size:13,bold:1});txt(Math.round(e[1]/E0*100)+' %',x+27,104,{size:14,bold:1,col:e[2]});});},
 read(s){const lo=(s.Ep||0)<8;return row('Thế năng',Math.round(s.Ep||0)+' %')+row('Động năng',Math.round(s.Ek||0)+' %')+row('Cơ năng (tổng)',Math.round((s.Ep||0)+(s.Ek||0))+' %')+verdict(s.ms?'Có lực cản: cơ năng giảm dần, chuyển thành nhiệt năng':'Bỏ qua lực cản: cơ năng được bảo toàn')+note(lo?'Đang qua vị trí thấp nhất: động năng lớn nhất.':'');},
 qs:['Ở vị trí nào thế năng lớn nhất? Ở vị trí nào động năng lớn nhất?','Khi con lắc đi từ biên về vị trí thấp nhất, dạng năng lượng nào chuyển thành dạng nào?','Chọn “Có lực cản”: phần cơ năng bị mất đã đi đâu?'],
 concl:'Trong quá trình dao động, thế năng và động năng của con lắc chuyển hoá qua lại. Nếu bỏ qua lực cản, cơ năng (tổng thế năng và động năng) được bảo toàn. Khi có lực cản, cơ năng giảm dần vì một phần chuyển thành nhiệt năng.'},

{id:'dannhiet',g:'nhiet',title:'Sự dẫn nhiệt',grade:'Lớp 8',
 goal:'Đun nóng một đầu của ba thanh đồng, nhôm, thuỷ tinh có gắn đinh bằng sáp; xem đinh trên thanh nào rơi trước.',

   ctx.strokeStyle='#1c2433';ctx.lineWidth=2;ctx.strokeRect(x0,y,L,22);txt(m[0],100,y+11,{bold:1});cflame(x0+16,y+70,17,s.c*11+i);

{id:'doiluu',g:'nhiet',title:'Sự đối lưu',grade:'Lớp 8',
 goal:'Đun cốc nước từ phía dưới và quan sát các dòng nước nóng đi lên, nước lạnh đi xuống.',
 ctl:[{k:'pos',label:'Vị trí ngọn lửa',type:'select',v:'c',opts:[['c','Ở giữa đáy cốc'],['l','Lệch về bên trái']]},{k:'P',label:'Độ lớn ngọn lửa',min:0,max:5,step:1,v:3,u:''}],
 init(s){s.p=[];for(let i=0;i<120;i++)s.p.push([Math.random(),Math.random()]);s.c=0;},
 draw(s,dt){s.c+=dt;const x0=250,y0=90,w=300,h=260,PI=Math.PI,sp=s.P*.035;ctx.fillStyle='#e0edfb';ctx.fillRect(x0,y0+20,w,h-20);
  for(const q of s.p){const x=q[0],y=q[1];let vx,vy;if(s.pos==='c'){vx=.5*PI*Math.sin(2*PI*x)*Math.cos(PI*y);vy=-PI*Math.cos(2*PI*x)*Math.sin(PI*y);}else{vx=-PI*Math.sin(PI*x)*Math.cos(PI*y);vy=PI*Math.cos(PI*x)*Math.sin(PI*y);}
   q[0]=clamp(x+vx*sp*dt+(Math.random()-.5)*.004*s.P,.02,.98);q[1]=clamp(y+vy*sp*dt+(Math.random()-.5)*.004*s.P,.02,.98);
   disc(x0+q[0]*w,y0+20+(1-q[1])*(h-20),4.5,s.P===0?'#94a3b8':vy>.15?'#ef4444':vy<-.15?'#2563eb':'#a78bfa');}

  if(s.P>0)cflame(s.pos==='c'?x0+w/2:x0+50,y0+h+62,9+s.P*4,s.c*11);
  disc(210,438,6,'#ef4444');txt('nước nóng hơn, đi lên',222,438,{align:'left',size:14});disc(430,438,6,'#2563eb');txt('nước lạnh hơn, đi xuống',442,438,{align:'left',size:14});},
 read(s){return row('Ngọn lửa',s.P===0?'Tắt':'Mức '+s.P)+row('Vị trí đun',s.pos==='c'?'Giữa đáy':'Lệch trái')+verdict(s.P===0?'Không đun: nước đứng yên, không có dòng đối lưu':'Nước nóng nở ra, nhẹ hơn nên đi lên; nước lạnh nặng hơn chìm xuống thế chỗ')+note('Các chấm chỉ biểu diễn dòng chảy của nước, không phải từng phân tử.');},
 qs:['Phần nước ngay phía trên ngọn lửa chuyển động theo hướng nào? Vì sao?','Chuyển ngọn lửa sang bên trái: dòng nước thay đổi thế nào?','Vì sao muốn đun nóng cả ấm nước phải đun từ đáy chứ không đun ở phía trên?'],
 concl:'Đối lưu là sự truyền nhiệt bằng các dòng chất lỏng hoặc chất khí. Phần chất lỏng bị đun nóng nở ra, có trọng lượng riêng nhỏ hơn nên đi lên; phần lạnh hơn đi xuống thế chỗ, tạo thành dòng tuần hoàn. Đây là cách truyền nhiệt chủ yếu của chất lỏng và chất khí.'},

{id:'canbangnhiet',g:'nhiet',title:'Phương trình cân bằng nhiệt',grade:'Lớp 8',
 goal:'Trộn nước nóng với nước lạnh, theo dõi nhiệt độ hai phần nước tiến về cùng một giá trị và so sánh nhiệt lượng toả ra với nhiệt lượng thu vào.',
 ctl:[{k:'m1',label:'Khối lượng nước nóng',min:50,max:500,step:50,v:200,u:'g'},{k:'t1',label:'Nhiệt độ nước nóng',min:40,max:100,step:5,v:80,u:'°C'},{k:'m2',label:'Khối lượng nước lạnh',min:50,max:500,step:50,v:300,u:'g'},{k:'t2',label:'Nhiệt độ nước lạnh',min:0,max:35,step:5,v:20,u:'°C'},{type:'button',label:'↻ Trộn lại',act(s){s.t=0;}}],
 init(s){s.t=0;},
 draw(s,dt){s.t+=dt;const tc=(s.m1*s.t1+s.m2*s.t2)/(s.m1+s.m2),e=Math.exp(-s.t/2.5),Th=tc+(s.t1-tc)*e,Tl=tc+(s.t2-tc)*e,col=T=>`rgb(${Math.round(70+T*1.8)},${Math.round(150-T*.5)},${Math.round(235-T*1.8)})`;
  const bx=70,bw=200,bb=380,h1=s.m1*.22,h2=s.m2*.22;ctx.fillStyle=col(Tl);ctx.fillRect(bx,bb-h2,bw,h2);ctx.fillStyle=col(Th);ctx.fillRect(bx,bb-h2-h1,bw,h1);
  pline([[bx,130],[bx,bb],[bx+bw,bb],[bx+bw,130]],'#1c2433',4);txt('Nước nóng: '+f(Th,1)+' °C',bx+bw/2,bb-h2-h1/2,{bold:1,col:'#fff',size:14});txt('Nước lạnh: '+f(Tl,1)+' °C',bx+bw/2,bb-h2/2,{bold:1,col:'#fff',size:14});
  txt('Nhiệt truyền từ nước nóng sang nước lạnh',bx+bw/2,410,{size:13,col:'#5d6b82'});
  const gx=390,gy=400,gw=330,gh=300,X=t=>gx+t/10*gw,Y=T=>gy-T/100*gh;axes(gx,gy,gx+gw,gy-gh,'Thời gian','Nhiệt độ (°C)');for(let T=20;T<=100;T+=20)txt(T,gx-10,Y(T),{size:12,align:'right',col:'#5d6b82'});
  line(gx,Y(tc),gx+gw,Y(tc),'#0f9d6b',1.5,[6,5]);txt('t cân bằng = '+f(tc,1)+' °C',gx+gw-4,gy-gh+4,{align:'right',size:14,bold:1,col:'#0f9d6b'});
  const te=Math.min(10,s.t),A=[],B=[];for(let t=0;t<=te;t+=.1){const k=Math.exp(-t/2.5);A.push([X(t),Y(tc+(s.t1-tc)*k)]);B.push([X(t),Y(tc+(s.t2-tc)*k)]);}if(A.length>1){pline(A,'#dc4a26',3.5);pline(B,'#2563eb',3.5);}},
 read(s){const tc=(s.m1*s.t1+s.m2*s.t2)/(s.m1+s.m2),Q1=s.m1/1000*4200*(s.t1-tc),Q2=s.m2/1000*4200*(tc-s.t2);return row('Nhiệt độ cân bằng',f(tc,1)+' °C')+row('Q toả = m₁·c·(t₁ − t)',f(Q1,0)+' J')+row('Q thu = m₂·c·(t − t₂)',f(Q2,0)+' J')+verdict('Q toả ra = Q thu vào')+note('c = 4200 J/kg.K, bỏ qua sự trao đổi nhiệt với cốc và môi trường.');},
 qs:['Nhiệt tự truyền từ phần nước nào sang phần nước nào? Đến khi nào thì dừng?','Tăng khối lượng nước lạnh thì nhiệt độ cân bằng tăng hay giảm?','Khi nào nhiệt độ cân bằng nằm đúng giữa t₁ và t₂?'],
 concl:'Khi hai vật trao đổi nhiệt với nhau, nhiệt truyền từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn cho đến khi nhiệt độ hai vật bằng nhau. Nhiệt lượng vật này toả ra bằng nhiệt lượng vật kia thu vào: Q toả = Q thu, với Q = m·c·Δt.'},

{id:'bayhoi',g:'nhiet',title:'Sự bay hơi',grade:'Lớp 6',
 goal:'Thay đổi nhiệt độ, gió và diện tích mặt thoáng để tìm xem tốc độ bay hơi của nước phụ thuộc vào những yếu tố nào.',
 ctl:[{k:'T',label:'Nhiệt độ',min:10,max:60,step:5,v:30,u:'°C'},{k:'wind',label:'Gió',min:0,max:5,step:1,v:1,u:''},{k:'A',label:'Diện tích mặt thoáng',min:1,max:5,step:1,v:3,u:''},{type:'button',label:'↻ Đổ nước lại',act(s){s.V=1;s.t=0;}}],
 init(s){s.V=1;s.t=0;s.p=[];s.acc=0;},
 draw(s,dt){const rate=(s.T/30)*(1+s.wind*.6)*s.A/3;s.rate=rate;if(s.V>0){s.V=Math.max(0,s.V-rate*dt/40);s.t+=dt;s.acc+=rate*dt*16;}
  const w=90+s.A*100,cx=400,bot=390,dep=78*s.V/s.A,sy=bot-dep;
  disc(690,70,18+s.T/3,'#fde047');txt(s.T+' °C',690,70,{bold:1,size:14});
  for(let i=0;i<s.wind;i++){const y=150+i*26,o=(s.t*60*(1+i*.2))%60;arrow(40+o,y,95+o,y,'#94a3b8',2);}if(s.wind)txt('Gió',60,130,{size:13,col:'#5d6b82'});
  ctx.fillStyle='rgba(80,160,235,.5)';ctx.fillRect(cx-w/2,sy,w,dep);pline([[cx-w/2,bot-95],[cx-w/2,bot],[cx+w/2,bot],[cx+w/2,bot-95]],'#1c2433',4);line(60,bot+3,740,bot+3,'#8a96a8',3);
  while(s.acc>=1&&s.p.length<300){s.acc--;s.p.push([cx-w/2+8+Math.random()*(w-16),sy,3]);}
  s.p=s.p.filter(q=>q[2]>0);for(const q of s.p){q[1]-=(28+s.T*.5)*dt;q[0]+=(s.wind*34+(Math.random()-.5)*20)*dt;q[2]-=dt;ctx.globalAlpha=clamp(q[2]/3,0,1);disc(q[0],q[1],3,'#3b82f6');}ctx.globalAlpha=1;
  txt(s.V>0?'Nước còn lại: '+Math.round(s.V*100)+' %':'Nước đã bay hơi hết sau '+f(s.t,0)+' s',cx,425,{bold:1,size:16,col:s.V>0?'#1c2433':'#dc4a26'});},
 read(s){return row('Tốc độ bay hơi (so với mức chuẩn)','× '+f(s.rate||0,1))+row('Nước còn lại',Math.round((s.V||0)*100)+' %')+row('Thời gian',f(s.t||0,0)+' s')+verdict('Nhiệt độ càng cao, gió càng mạnh, mặt thoáng càng rộng thì bay hơi càng nhanh')+note('Cùng một lượng nước: mặt thoáng rộng hơn thì lớp nước nông hơn.');},
 qs:['Chỉ thay đổi một yếu tố mỗi lần và bấm “Đổ nước lại”. Yếu tố nào làm nước cạn nhanh hơn?','Vì sao khi làm thí nghiệm phải giữ nguyên các yếu tố còn lại?','Phơi quần áo thế nào thì mau khô nhất?'],
 concl:'Sự bay hơi là sự chuyển từ thể lỏng sang thể hơi, xảy ra ở mặt thoáng của chất lỏng và ở mọi nhiệt độ. Tốc độ bay hơi phụ thuộc vào nhiệt độ, gió và diện tích mặt thoáng của chất lỏng.'},

/* ===== ĐIỆN ===== */
{id:'dientich',g:'dien',title:'Hai loại điện tích',grade:'Lớp 8',
 goal:'Cho hai quả cầu nhẹ nhiễm điện cùng loại hoặc khác loại rồi quan sát chúng đẩy nhau hay hút nhau.',
 ctl:[{k:'q1',label:'Quả cầu A',type:'select',v:1,opts:[[1,'Nhiễm điện dương (+)'],[-1,'Nhiễm điện âm (−)'],[0,'Không nhiễm điện']]},{k:'q2',label:'Quả cầu B',type:'select',v:1,opts:[[1,'Nhiễm điện dương (+)'],[-1,'Nhiễm điện âm (−)'],[0,'Không nhiễm điện']]},{k:'m',label:'Mức độ nhiễm điện',min:1,max:5,step:1,v:3,u:''}],
 init(s){s.a=0;},
 kind(s){const pr=s.q1*s.q2;return pr>0?1:pr<0?-1:(s.q1||s.q2)?-.5:0;},
 draw(s,dt){const kd=this.kind(s),tg=kd===1?s.m*5:kd===-1?-s.m*1.8:kd?-s.m*.8:0;s.a+=(tg-s.a)*Math.min(1,dt*4);const a=s.a*Math.PI/180,L=250,py=50;line(200,py,600,py,'#1c2433',5);
  [[320,-1,s.q1,'A'],[480,1,s.q2,'B']].forEach(([px,sg,q,n])=>{const bx=px+sg*L*Math.sin(a),by=py+L*Math.cos(a);line(px,py,bx,by,'#64748b',2);disc(bx,by,30,q>0?'#fecaca':q<0?'#bfdbfe':'#e5e7eb','#1c2433');

 qs:['Thử đủ các cặp (+,+), (−,−), (+,−). Khi nào hai quả cầu đẩy nhau, khi nào hút nhau?','Tăng mức độ nhiễm điện thì góc lệch của dây treo thay đổi thế nào?','Vì sao thước nhựa sau khi cọ xát vào vải khô lại hút được các vụn giấy?'],

{id:'dientro',g:'dien',title:'Điện trở của dây dẫn',grade:'Lớp 9',
 goal:'Thay đổi chiều dài, tiết diện và vật liệu làm dây để xem điện trở của dây dẫn phụ thuộc vào những yếu tố nào.',
 ctl:[{k:'rho',label:'Vật liệu',type:'select',v:1.7,opts:[[1.7,'Đồng (ρ = 1,7·10⁻⁸ Ω·m)'],[2.8,'Nhôm (ρ = 2,8·10⁻⁸ Ω·m)'],[12,'Sắt (ρ = 12·10⁻⁸ Ω·m)'],[110,'Nicrom (ρ = 110·10⁻⁸ Ω·m)']]},{k:'l',label:'Chiều dài l',min:1,max:100,step:1,v:20,u:'m'},{k:'A',label:'Tiết diện S',min:0.1,max:2,step:0.1,v:0.5,u:'mm²',d:1}],
 init(s){s.o=0;},

 fmt(R){return R<1?f(R,3):R<100?f(R,2):f(R,0);},
 draw(s,dt){const R=this.R(s),I=6/R,len=120+s.l*5.4,th=10+s.A*24,x0=400-len/2,y=240,col={1.7:'#d99058',2.8:'#cbd5e1',12:'#8b95a5',110:'#b5b08a'}[s.rho];s.o+=clamp(I*10,3,240)*dt;

  line(x0,y+th/2+22,x0+len,y+th/2+22,'#1c2433',1.5);line(x0,y+th/2+16,x0,y+th/2+28,'#1c2433',1.5);line(x0+len,y+th/2+16,x0+len,y+th/2+28,'#1c2433',1.5);txt('l = '+s.l+' m',400,y+th/2+40,{bold:1});
  txt('S = '+f(s.A,1)+' mm²',400,y-th/2-18,{bold:1});txt('R = ρ · l / S = '+this.fmt(R)+' Ω',400,70,{bold:1,size:24,col:'#0f9d6b'});
  txt('Chấm xanh: dòng điện tích khi đặt hiệu điện thế 6 V – điện trở càng lớn, dòng càng yếu',400,430,{size:13,col:'#5d6b82'});},
 read(s){const R=this.R(s);return row('Điện trở suất ρ',f(s.rho,1)+'·10⁻⁸ Ω·m')+row('Điện trở R',this.fmt(R)+' Ω')+row('Dòng điện khi U = 6 V',f(6/R,2)+' A')+verdict('R tỉ lệ thuận với chiều dài, tỉ lệ nghịch với tiết diện và phụ thuộc vật liệu');},
 qs:['Tăng chiều dài dây lên gấp đôi thì điện trở thay đổi thế nào?','Tăng tiết diện dây lên gấp đôi thì điện trở thay đổi thế nào?','Vì sao dây dẫn điện làm bằng đồng, còn dây đốt nóng của bếp điện làm bằng nicrom?'],

 draw(s){const xs=90,X=700,yc=230,b=40,a=s.a,xo=xs+s.xo*10,g=this.geo(s),Yu=g.Yu,Yp=Math.min(210,g.Yp);

  if(Yu>0)fpoly([[xo,yc-b],[X,yc-Math.min(210,Yu)],[X,yc+Math.min(210,Yu)],[xo,yc+b]],'#0f172a');else fpoly([[xo,yc-b],[xs+(xo-xs)*a/(a-b),yc],[xo,yc+b]],'#0f172a');

apsuatlong:[
 ['Đập thuỷ điện','Chân đập phải xây dày hơn đỉnh đập, vì càng xuống sâu áp suất của nước lên thân đập càng lớn.',
  sv(`<rect x="0" y="28" width="78" height="62" fill="#bfdbfe" stroke="none"/><path d="M78 18h14l36 72H78z" fill="#94a3b8"/><path d="M0 90h160M0 28h78" stroke="#2f6fb5"/><path d="M40 46h30M40 62h30M40 78h30M64 42l6 4-6 4M64 58l6 4-6 4M64 74l6 4-6 4" stroke="#dc2626" stroke-width="1.6"/>`)],
 ['Tàu ngầm','Vỏ tàu ngầm làm bằng thép dày để chịu được áp suất rất lớn của nước biển ở độ sâu hàng trăm mét.',
  sv(`<rect width="160" height="100" fill="#93c5fd" stroke="none"/><ellipse cx="80" cy="60" rx="50" ry="17" fill="#475569"/><rect x="68" y="32" width="20" height="14" fill="#475569"/>${dots([[56,60],[78,60],[100,60]],'#fde047',4)}`)],
 ['Bồn nước trên cao','Bồn nước đặt trên mái nhà hoặc tháp cao để nước ở vòi phía dưới có áp suất lớn, chảy mạnh.',

matnghieng:[
 ['Đường đèo','Đường lên đèo làm ngoằn ngoèo để đường dài và thoải hơn, xe cần lực kéo nhỏ hơn khi leo dốc.',
  sv(`<path d="M14 92L80 12l66 80z" fill="#86a98a"/><path d="M36 86h84L58 64h46L72 44h20" stroke="#fff" stroke-width="3.5"/>`)],
 ['Tấm ván dắt xe','Kê tấm ván để dắt xe máy lên thềm nhà: lực đẩy nhỏ hơn nhiều so với nhấc thẳng cả chiếc xe lên.',
  sv(`<path d="M6 90h148" stroke="#8a96a8"/><rect x="104" y="52" width="50" height="38" fill="#cbd5e1"/><path d="M26 90l78-38" stroke="#b7793a" stroke-width="5"/><circle cx="60" cy="60" r="11" fill="#fff" stroke-width="4"/>`)],
 ['Cầu thang','Cầu thang là một dạng mặt phẳng nghiêng: đi quãng đường dài hơn nhưng mỗi bước chỉ cần nâng người lên một đoạn ngắn.',
  sv(`<path d="M16 90h24V72h24V54h24V36h24V18h32v72z" fill="#e2e8f0"/>`)]],
conlac:[
 ['Xích đu','Lên tới điểm cao nhất, xích đu có thế năng lớn nhất; qua điểm thấp nhất, nó chuyển động nhanh nhất.',

 ['Tàu lượn siêu tốc','Tàu được kéo lên đỉnh cao nhất rồi thả: thế năng chuyển thành động năng khi lao xuống và ngược lại khi leo lên.',
  sv(`<path d="M4 28q28-22 44 26t40 12 30-40 38 54" stroke="#64748b" stroke-width="3.5"/><rect x="10" y="8" width="20" height="11" rx="2" fill="#dc4a26" transform="rotate(-24 20 14)"/><path d="M24 92V22M70 92V70M118 92V26" stroke-width="1.5" stroke="#94a3b8"/>`)],
 ['Nhà máy thuỷ điện','Nước trên hồ cao có thế năng lớn; khi chảy xuống, thế năng chuyển thành động năng làm quay tuabin phát điện.',
  sv(`<rect x="0" y="22" width="58" height="68" fill="#bfdbfe" stroke="none"/><path d="M58 14h14v76H58z" fill="#94a3b8"/><path d="M72 34q24 2 30 34" stroke="#3b82f6" stroke-width="4"/><circle cx="110" cy="76" r="13" fill="#fde047"/><path d="M110 63v26M97 76h26M101 67l18 18M119 67l-18 18" stroke-width="1.8"/><path d="M0 90h160"/>`)]],
nonhiet:[
 ['Khe hở đường ray','Giữa hai thanh ray có khe hở nhỏ để khi trời nóng, ray dài ra mà không bị cong vênh.',
  sv(`<path d="M16 28v52M40 28v52M64 28v52M96 28v52M120 28v52M144 28v52" stroke="#92400e" stroke-width="4"/><path d="M6 42h66M88 42h66M6 66h66M88 66h66" stroke="#64748b" stroke-width="6"/>${tx(80,16,'khe hở',9,'#dc2626')}`)],
 ['Băng kép trong bàn là','Hai lá kim loại nở vì nhiệt khác nhau được ghép chặt; khi nóng, băng kép cong lại và tự ngắt mạch điện.',
  sv(`<rect x="10" y="58" width="16" height="26" fill="#475569"/><path d="M26 68q56-4 104-44" stroke="#d99058" stroke-width="5"/><path d="M26 74q58-4 108-45" stroke="#8b95a5" stroke-width="5"/>${tx(104,80,'cong khi nóng',9,'#475569')}`)],
 ['Dây điện mùa hè','Dây điện trên cột chùng xuống nhiều hơn vào mùa hè vì dây nở dài ra; mùa đông dây co lại và căng hơn.',
  sv(`${SUN(80,16,9)}<path d="M26 92V22M134 92V22M14 30h24M122 30h24" stroke-width="3"/><path d="M26 30q54 44 108 0" stroke-width="1.8"/><path d="M26 30q54 16 108 0" stroke-width="1.2" stroke-dasharray="4 4" stroke="#94a3b8"/>`)]],
dannhiet:[
 ['Nồi kim loại, quai nhựa','Thân nồi bằng kim loại dẫn nhiệt tốt để nấu nhanh; quai bằng nhựa dẫn nhiệt kém nên cầm không bị bỏng.',
  sv(`<rect x="46" y="38" width="68" height="40" rx="4" fill="#cbd5e1"/><rect x="20" y="44" width="26" height="10" rx="4" fill="#1c2433"/><rect x="114" y="44" width="26" height="10" rx="4" fill="#1c2433"/>${flame(66,98)}${flame(94,98)}`)],
 ['Áo ấm mùa đông','Áo bông, áo len giữ được lớp không khí dẫn nhiệt kém sát cơ thể, nên nhiệt của cơ thể ít truyền ra ngoài.',

 ['Thìa trong cốc nước nóng','Thìa kim loại cắm trong cốc nước nóng thì cán thìa nóng lên rất nhanh; thìa nhựa hoặc thìa gỗ thì không.',
  sv(`<path d="M50 36v44q0 8 8 8h44q8 0 8-8V36z" fill="#fde9c4" stroke="none"/><path d="M50 30v50q0 8 8 8h44q8 0 8-8V30"/><path d="M112 8L80 74" stroke="#94a3b8" stroke-width="5"/>`)]],
doiluu:[
 ['Đun nước từ đáy ấm','Bếp đặt dưới đáy ấm: nước nóng ở đáy đi lên, nước lạnh phía trên đi xuống nên cả ấm nước nóng đều.',

 ['Gió biển','Ban ngày đất liền nóng nhanh hơn biển, không khí nóng trên đất liền bay lên, không khí mát từ biển thổi vào.',
  sv(`<rect x="0" y="72" width="80" height="28" fill="#bfdbfe" stroke="none"/><rect x="80" y="66" width="80" height="34" fill="#e8c98a" stroke="none"/>${SUN(134,16,9)}<path d="M22 58q50-12 98 0M110 50l10 8-12 6" stroke="#2563eb"/><path d="M122 32q-50-12-98 0M34 24l-10 8 12 6" stroke="#dc2626" stroke-dasharray="5 4"/>`)],
 ['Điều hoà lắp trên cao','Máy lạnh lắp ở trên cao vì không khí lạnh nặng hơn sẽ đi xuống, tạo dòng đối lưu làm mát cả phòng.',
  sv(`<rect x="36" y="12" width="88" height="26" rx="6" fill="#f1f5f9"/><path d="M48 31h64"/><path d="M58 46v30M80 46v38M102 46v30M52 70l6 8 6-8M74 78l6 8 6-8M96 70l6 8 6-8" stroke="#2563eb"/>`)]],
canbangnhiet:[
 ['Pha nước tắm','Pha nước nóng với nước lạnh: nước nóng toả nhiệt, nước lạnh thu nhiệt cho đến khi cả chậu có cùng một nhiệt độ.',
  sv(`<path d="M26 58h108l-12 32H38z" fill="#bfdbfe"/><path d="M52 12v26" stroke="#dc2626" stroke-width="7"/><path d="M108 12v26" stroke="#2563eb" stroke-width="7"/><path d="M52 42v14M108 42v14" stroke-dasharray="3 4" stroke-width="2"/>${tx(52,8,'nóng',8,'#dc2626')}${tx(108,8,'lạnh',8,'#2563eb')}`)],
 ['Nước ngọt ướp đá','Thả đá vào ly nước: nước truyền nhiệt cho đá nên nước lạnh đi, còn đá nóng lên và tan dần.',
  sv(`${GLASS}<rect x="64" y="42" width="14" height="14" fill="#f0f9ff" transform="rotate(-12 71 49)"/><rect x="82" y="50" width="14" height="14" fill="#f0f9ff" transform="rotate(15 89 57)"/><path d="M92 6L80 44" stroke="#dc4a26" stroke-width="3"/>`)],
 ['Tôi thép','Thợ rèn nhúng thanh thép nung đỏ vào nước: thép toả nhiệt nguội đi rất nhanh, nước thu nhiệt nóng lên và bốc hơi.',

bayhoi:[
 ['Phơi quần áo','Quần áo mau khô khi phơi ở chỗ nắng, có gió và được căng rộng ra: đủ cả ba yếu tố làm nước bay hơi nhanh.',
  sv(`<path d="M6 22h148"/><path d="M50 22L32 36l9 12 9-7v40h40V41l9 7 9-12-18-14q-15 9-30 0z" fill="#60a5fa"/>${SUN(134,64,11)}`)],
 ['Ruộng muối','Nước biển được dẫn vào các ô ruộng nông và rộng; nắng và gió làm nước bay hơi hết, để lại muối.',
  sv(`${SUN(134,20,10)}<rect x="10" y="56" width="140" height="26" fill="#bfdbfe" stroke="none"/><path d="M10 82h140M10 56h140M10 56v26M56 56v26M104 56v26M150 56v26"/><path d="M22 82l11-15 11 15zM68 82l13-19 13 19zM116 82l11-15 11 15z" fill="#fff"/>`)],
 ['Máy sấy tóc','Máy sấy thổi luồng gió nóng: vừa tăng nhiệt độ vừa tạo gió nên nước trên tóc bay hơi rất nhanh.',
  sv(`<path d="M36 28h58q16 0 16 15t-16 15H36z" fill="#f472b6"/><rect x="56" y="58" width="18" height="32" rx="5" fill="#be185d"/><path d="M120 32h26M122 43h30M120 54h26" stroke="#94a3b8"/>`)]],
dientich:[
 ['Thước nhựa hút giấy vụn','Cọ thước nhựa vào vải khô, thước bị nhiễm điện và hút được các mẩu giấy vụn.',
  sv(`<rect x="18" y="22" width="124" height="16" fill="#93c5fd"/><path d="M30 22v6M46 22v6M62 22v6M78 22v6M94 22v6M110 22v6M126 22v6" stroke-width="1.5"/>${[[40,44],[66,40],[92,46],[118,42],[54,74],[84,80],[108,72]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="9" height="7" fill="#fff" stroke-width="1.5"/>`).join('')}`)],
 ['Tia sét','Đám mây dông nhiễm điện rất mạnh; sét là sự phóng điện giữa các đám mây hoặc giữa đám mây với mặt đất.',
  sv(`<path d="M40 46q-18 0-16-15t20-11q6-15 26-11t19 13q18-2 20 11t-15 13z" fill="#94a3b8"/><path d="M84 48L68 70h13L70 96l28-34H86l10-14z" fill="#fde047"/>`)],
 ['Lược chải tóc khô','Chải tóc khô bằng lược nhựa, lược và tóc nhiễm điện trái dấu nên tóc bị lược hút dựng lên.',
  sv(`<rect x="28" y="46" width="104" height="16" rx="5" fill="#f59e0b"/><path d="M36 62v24M46 62v24M56 62v24M66 62v24M76 62v24M86 62v24M96 62v24M106 62v24M116 62v24M126 62v24" stroke-width="2"/><path d="M40 40q4-18-6-30M70 40q0-16 4-30M100 40q-2-16 8-28M124 40q4-14 14-22" stroke-width="1.4" stroke="#92400e"/>`)]],
dientro:[
 ['Dây điện lõi đồng','Lõi dây điện làm bằng đồng vì đồng có điện trở suất nhỏ, dẫn điện tốt, ít hao phí và ít nóng.',
  sv(`<rect x="8" y="36" width="104" height="28" rx="8" fill="#1c2433"/><rect x="112" y="43" width="42" height="14" fill="#d99058"/>`)],
 ['Dây đốt nóng bếp điện','Dây đốt làm bằng nicrom có điện trở suất lớn nên toả nhiều nhiệt khi có dòng điện chạy qua.',
  sv(`<circle cx="80" cy="50" r="42" fill="#475569"/><path d="M74 50a6 6 0 1 1 12 0a12 12 0 1 1-24 0a18 18 0 1 1 36 0a24 24 0 1 1-48 0a30 30 0 1 1 60 0" stroke="#f97316" stroke-width="3.5"/>`)],
 ['Đường dây tải điện','Dây tải điện đi xa hàng trăm kilômét nên phải làm to (tiết diện lớn) để giảm điện trở, giảm hao phí.',
  sv(`<path d="M80 8L58 92M80 8l22 84M64 66h32M70 44h20M46 24h68M46 24v10M114 24v10" stroke-width="2.2"/><path d="M0 46q23 8 46-12M114 34q23 20 46 12" stroke-width="1.5"/>`)]],
congsuat:[
 ['Số oát ghi trên bóng đèn','Trên mỗi thiết bị có ghi công suất định mức, ví dụ 220 V – 10 W: số oát càng lớn thì càng tốn điện.',
  sv(`<circle cx="52" cy="40" r="24" fill="#fef9c3"/><rect x="43" y="64" width="18" height="16" fill="#94a3b8"/>${tx(116,44,'220 V',13)}${tx(116,64,'10 W',13,'#dc2626')}`)],
 ['Nhãn năng lượng','Nhãn năng lượng trên tủ lạnh, điều hoà: càng nhiều sao thì thiết bị càng tiết kiệm điện.',
  sv(`<rect x="44" y="8" width="72" height="84" rx="8" fill="#fff"/>${tx(80,38,'★★★★★',13,'#f59e0b')}${tx(80,60,'TIẾT KIỆM',8)}${tx(80,74,'NĂNG LƯỢNG',8)}`)],
 ['Hoá đơn tiền điện','Tiền điện tính theo số kWh trên công tơ: mỗi “số điện” là 1 kWh.',

junlenxo:[
 ['Bàn là','Dây đốt trong bàn là có điện trở lớn; dòng điện chạy qua làm nó nóng lên để là phẳng quần áo.',

 ['Ấm siêu tốc','Thanh đốt ở đáy ấm biến điện năng thành nhiệt năng, làm sôi nước chỉ trong vài phút.',
  sv(`<path d="M52 78V40q0-10 28-10t28 10v38z" fill="#e2e8f0"/><path d="M108 44h10q10 0 10 14t-10 14h-10M52 42l-14-8"/><rect x="42" y="78" width="76" height="10" rx="3" fill="#475569"/><path d="M62 70h36" stroke="#f97316" stroke-width="4"/>`)],
 ['Bóng đèn sợi đốt','Dây tóc bị dòng điện nung nóng tới hơn 2000 °C nên phát sáng; phần lớn điện năng lại biến thành nhiệt.',

camung:[
 ['Đinamô xe đạp','Bánh xe quay làm nam châm trong đinamô quay trước cuộn dây, tạo ra dòng điện thắp sáng đèn xe.',
  sv(`<circle cx="48" cy="58" r="34" stroke-width="4"/><circle cx="48" cy="58" r="3" fill="#1c2433"/><rect x="80" y="18" width="16" height="28" rx="5" fill="#64748b"/><path d="M96 32h26"/><path d="M122 22l18-7v34l-18-7z" fill="#fde047"/>`)],
 ['Điện gió','Gió làm quay cánh quạt, cánh quạt làm quay máy phát điện: cuộn dây và nam châm quay so với nhau tạo ra dòng điện.',
  sv(`<path d="M80 94V44" stroke-width="4"/><path d="M80 44V8M80 44l32 18M80 44L48 62" stroke="#64748b" stroke-width="6"/><circle cx="80" cy="44" r="6" fill="#1c2433"/><path d="M40 94h80"/>`)],
 ['Sạc không dây','Cuộn dây trong đế sạc tạo từ trường biến đổi, làm xuất hiện dòng điện cảm ứng trong cuộn dây của điện thoại.',
  sv(`<ellipse cx="80" cy="82" rx="52" ry="10" fill="#cbd5e1"/><rect x="58" y="14" width="44" height="48" rx="7" fill="#1c2433"/><path d="M66 70q14-8 28 0M60 76q20-12 40 0" stroke="#2563eb" stroke-width="2"/>`)]],
bongtoi:[
 ['Nhật thực','Khi Mặt Trăng nằm giữa Mặt Trời và Trái Đất, nơi nằm trong vùng bóng tối của Mặt Trăng thấy nhật thực toàn phần.',
  sv(`<rect width="160" height="100" fill="#0f172a" stroke="none"/><circle cx="24" cy="50" r="18" fill="#fde047" stroke="none"/><circle cx="88" cy="50" r="7" fill="#94a3b8" stroke="none"/><circle cx="136" cy="50" r="15" fill="#60a5fa" stroke="none"/><path d="M24 32L122 48M24 68l98-16" stroke="#fde047" stroke-width="1" stroke-dasharray="3 3"/>`)],
 ['Bóng người dưới nắng','Ánh sáng truyền thẳng nên phía sau người có bóng; buổi trưa bóng ngắn, sáng sớm và chiều muộn bóng dài.',
  sv(`${SUN(22,18,11)}<path d="M6 90h148" stroke="#8a96a8"/><circle cx="76" cy="30" r="8" fill="#1c2433"/><path d="M76 38v28M76 46l-12 10M76 46l12 10M76 66l-9 22M76 66l9 22" stroke-width="3.5"/><path d="M82 92l56 2" stroke="#475569" stroke-width="7" opacity=".5"/>`)],
 ['Đèn phòng mổ','Đèn mổ gồm nhiều bóng xếp trên một chao rộng, nên tay bác sĩ không tạo ra bóng tối che vết mổ.',
  sv(`<path d="M80 4v12"/><ellipse cx="80" cy="30" rx="54" ry="15" fill="#e2e8f0"/>${dots([[44,30],[62,34],[80,36],[98,34],[116,30]],'#fde047',5)}<path d="M44 44l16 44M80 48v42M116 44l-16 44" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>`)]],
guongphang:[
 ['Gương soi','Soi gương ta thấy ảnh của mình ở sau gương, to bằng mình và cách gương đúng bằng khoảng cách mình đứng.',

 ['Kính tiềm vọng','Hai gương phẳng đặt nghiêng 45° trong ống giúp người trong tàu ngầm hay sau vật chắn quan sát được bên ngoài.',

/* ---------- khung ứng dụng ---------- */
let cur=null,S={},paused=false,last=0,lastRead='';
const $=id=>document.getElementById(id);
function buildNav(){const nav=$('nav');for(const g in GROUPS){const d=document.createElement('div');d.className='grp';d.innerHTML=`<i style="background:${GROUPS[g][1]}"></i>${GROUPS[g][0]}`;nav.appendChild(d);
  LESSONS.filter(l=>l.g===g).forEach(l=>{const b=document.createElement('button');b.textContent=l.title;b.dataset.id=l.id;b.onclick=()=>open(l.id);nav.appendChild(b);});}}
function open(id){cur=LESSONS.find(l=>l.id===id)||LESSONS[0];S={};cur.ctl.forEach(c=>{if(c.k)S[c.k]=c.v;});cur.init(S);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===cur.id));
  const col=GROUPS[cur.g][1];document.documentElement.style.setProperty('--acc',col);
  $('tag').textContent=GROUPS[cur.g][0]+' · '+cur.grade;$('tag').style.background=col;$('title').textContent=cur.title;$('goal').textContent=cur.goal;
  $('qs').innerHTML=cur.qs.map(q=>`<li>${q}</li>`).join('');$('concl').textContent=cur.concl;$('det').open=false;
  $('real').innerHTML=(REAL[cur.id]||[]).map(r=>`<figure>${r[2]}<figcaption><b>${r[0]}</b>${r[1]}</figcaption></figure>`).join('');
  const box=$('ctl');box.innerHTML='';
  cur.ctl.forEach(c=>{const d=document.createElement('div');d.className='ctl';
    if(c.type==='button'){const b=document.createElement('button');b.className='btn';b.style.width='100%';b.textContent=c.label;b.onclick=()=>c.act.call(cur,S);d.appendChild(b);}
    else if(c.type==='select'){d.innerHTML=`<label>${c.label}</label>`;const sel=document.createElement('select');c.opts.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];sel.appendChild(op);});sel.value=c.v;
      sel.onchange=()=>{S[c.k]=typeof c.v==='number'?Number(sel.value):sel.value;};d.appendChild(sel);}
    else{const lb=document.createElement('label'),out=document.createElement('output');lb.append(c.label,out);const inp=document.createElement('input');inp.type='range';inp.min=c.min;inp.max=c.max;inp.step=c.step;inp.value=c.v;
      const show=()=>out.textContent=f(S[c.k],c.d||0)+' '+c.u;inp.oninput=()=>{S[c.k]=Number(inp.value);show();};show();d.append(lb,inp);}
    box.appendChild(d);});
  const nv=$('nav'),on=nv.querySelector('button.on');if(on&&nv.scrollWidth>nv.clientWidth+4)nv.scrollLeft=on.offsetLeft-nv.clientWidth/2+on.offsetWidth/2;
  try{history.replaceState(null,'','#'+cur.id);}catch(e){}
  lastRead='';}
function fit(){const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;const w=Math.max(100,Math.round(r.width*dpr));if(cv.width!==w){cv.width=w;cv.height=Math.round(w*H/W);}scale=cv.width/W;}
function frame(ts){const dt=paused?0:Math.min(.05,(ts-last)/1000||0);last=ts;fit();ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,W,H);
  cur.draw(S,dt);const h=cur.read(S);if(h!==lastRead){$('read').innerHTML=h;lastRead=h;}requestAnimationFrame(frame);}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Chạy tiếp':'⏸ Tạm dừng';};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();};
if(!document.fullscreenEnabled)$('full').style.display='none';
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'✕ Thoát trình chiếu':'⛶ Trình chiếu';});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(cur&&id!==cur.id)open(id);});
buildNav();open(location.hash.slice(1));requestAnimationFrame(frame);
</script>
