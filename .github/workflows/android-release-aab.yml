name: Android release bundle (Google Play) - Vật lý dễ hiểu

# Builds the .aab you upload to Google Play, plus a release .apk you can install to try it.
# Signing needs these repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
# Without them it still builds, but unsigned (only useful to check that the build works).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (a whole number that must go up with every upload)"
        default: "1"
      version_name:
        description: "Version name shown to people"
        default: "1.0.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the site into the app
        run: |
          mkdir -p app/www
          cp index.html icon-192.png icon-512.png app/www/
          cp -r img fonts app/www/

      - name: Create the Android project
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Prepare the signing key
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.p12" >> "$GITHUB_ENV"
            echo "Signing key found."
          else
            echo "No signing key in the repository secrets: building unsigned."
          fi

      - name: Set version and signing
        working-directory: app
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node patch-android.mjs

      - name: Build the release bundle and APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VatLyDeHieu-release-aab
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: VatLyDeHieu-release-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
